name: ChatDemo
options:
  deploymentTarget:
    iOS: '16.4'
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  CaylexChat:
    path: ../..
targets:
  ChatDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: CaylexChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.caylex.ChatDemo
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        # Pairing resources are local development data, never shipping resources.
        EXCLUDED_SOURCE_FILE_NAMES: DeviceTestConfig.json
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Talk to your Caylex assistant.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
      configs:
        Debug:
          EXCLUDED_SOURCE_FILE_NAMES: ''
    info:
      path: Info.plist
      properties:
        NSMicrophoneUsageDescription: Talk to your Caylex assistant.
        NSLocalNetworkUsageDescription: Connect to the development token server on your Mac.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  ChatDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../Tests/CaylexChatTests
    dependencies:
      - target: ChatDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.caylex.ChatDemoTests
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  ChatDemo:
    build:
      targets:
        ChatDemo: all
    test:
      targets:
        - ChatDemoTests
