name: Publish iOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New Swift package version (e.g. 0.1.0; no v prefix)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Require the production branch
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/prod' ]; then
            echo '::error::Select prod when running Publish iOS release.'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          TAG=$(python3 Scripts/check-release-version.py "$RELEASE_VERSION")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify release guards and bundle provenance
        run: |
          python3 -m unittest discover -s Tests/Automation
          python3 Scripts/verify-widget.py

      - name: Test package and streaming bridge
        run: |
          swift test
          node --test Tests/JavaScript/native-fetch.test.mjs

      - name: Generate demo project
        run: |
          brew install xcodegen
          xcodegen generate --spec Examples/ChatDemo/project.yml

      - name: Compile device and simulator variants
        run: |
          xcodebuild -project Examples/ChatDemo/ChatDemo.xcodeproj \
            -scheme ChatDemo -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project Examples/ChatDemo/ChatDemo.xcodeproj \
            -scheme ChatDemo -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Tag and publish the tested production commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Refuse a stale release if prod moved while its checks were running.
          PROD_HEAD=$(git ls-remote origin refs/heads/prod | cut -f1)
          if [ "$PROD_HEAD" != "$GITHUB_SHA" ]; then
            echo '::error::prod changed during this run. Run the release again.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "CaylexChat $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          python3 - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path('Sources/CaylexChat/Resources/widget-build.json').read_text())
          pathlib.Path('release-notes.md').write_text(
              'Install the CaylexChat product with Swift Package Manager using this release version.\n\n'
              f"Bundled web widget: {m['widgetVersion']}\n\n"
              f"Frontend source: https://github.com/caylex-ai/caylex-frontend/commit/{m['frontendCommit']}\n\n"
              f"Bundle SHA-256: `{m['sha256']}`\n")
          PY
          gh release create "$RELEASE_TAG" --verify-tag --title "CaylexChat $RELEASE_TAG" \
            --notes-file release-notes.md
